<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>Net Banking</h2>
  <input type="text" id="username" placeholder="Enter your username"><br><br>
  <input type="password" id="password" placeholder="Enter your password"><br><br>
  <button onclick="login()">Login</button>
  <button onclick="showData()">Show Session Data</button>
  <button onclick="logout()">Logout</button>
  <p id="message"></p>
  
  <script>
    function login() {
      var username = document.getElementById("username").value;
      var password = document.getElementById("password").value;

      if (username === "sabir" && password === "030718") {
        sessionStorage.setItem("username", "SABIR");
        document.getElementById("message").innerText = "Welcome, " + username + "! Login successful!";
      } 
      else {
        document.getElementById("message").innerText = "Invalid username or password.";
      }
    }
    function showData(){
    var username =sessionStorage.getItem("username");
    if(username){
    document.getElementById("message").innerText ="Storage data:"+ username;
    }
    else{
    document.getElementById("message").innerText ="No session data available";
  
    }
    }
  </script>
</body>
</html>
