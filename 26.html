<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            body {
                background: #0d0d0d;
                margin: 0;
                color: #f5f5f5;
                font-family: 'Segoe UI', system-ui, sans-serif;
            }
            .header {
                background: linear-gradient(135deg, #e50914, #6a0dad, #1a1aff);
                padding: 30px 20px;
                text-align: center;
            }
            .header h1 {
                margin: 0;
            }
            .nav {
                background: linear-gradient(135deg, #ff512f, #f09819);
                display: flex;
                justify-content: space-around;
            }
            .nav div {
                padding: 14px 20px;
                color: #fff;
                font-weight: 600;
            }
            .main {
                display: grid;
                grid-template-columns: 75% 25%;
            }
            .left {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }
            .content {
                grid-column: 1 / -1;
                background: linear-gradient(135deg, #11998e, #38ef7d);
                padding: 25px;
                text-align: center;
                color: #0d0d0d;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 150px;
                border: 1px solid #0d0d0d;
                box-sizing: border-box;
            }
            .sidebar {
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #f7971e, #ffd200);
                color: #0d0d0d;
                font-weight: 600;
                border: 1px solid #0d0d0d;
                box-sizing: border-box;
            }
            .box {
                text-align: center;
                font-weight: 600;
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 300px;
                border: 1px solid #0d0d0d;
                box-sizing: border-box;
            }
            .box:nth-child(1) {
                background: linear-gradient(135deg, #ff512f, #dd2476);
            }
            .box:nth-child(2) {
                background: linear-gradient(135deg, #4776e6, #8e54e9);
            }
            .box:nth-child(3) {
                background: linear-gradient(135deg, #00c9ff, #92fe9d);
                color: #0d0d0d;
            }
            .footer {
                background: #0000ff;
                color: #fff;
                text-align: center;
                padding: 14px;
                font-size: 24px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Header Element</h1>
        </div>
        <div class="nav">
            <div>Home</div>
            <div>About</div>
            <div>Contact</div>
        </div>
        <div class="main">
            <div class="left">
                <div class="box">Small Box1</div>
                <div class="box">Small Box2</div>
                <div class="box">Small Box3</div>
                <div class="content">
                     Main Content
                </div>
            </div>
            <div class="sidebar">
                Side bar
            </div>
        </div>
        <div class="footer">
            Footer
        </div>
    </body>
</html>
