<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            background-color: gold;
            color: white;
            text-align: center;
            height: 50px;
        }
        .nav {
            background-color: lavender;
            display: flex;
            justify-content: space-around;
        }
        .main{
            background-color: linen;
            display: grid;
            grid-template-columns: 75% 25%;
        }
        .left{
            background-color: cornflowerblue;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        .box{
            height: 200px;
            background: linear-gradient(135deg,deeppink,violet);
            border: 2px solid white;

            display: flex;
            justify-content: center;
            align-items: center;

        }
         /* Main content */
        .content {
            height: 170px;
             background: linear-gradient(135deg,blue,darkturquoise);
        
            grid-column: 1 / 4;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sidebar{
             background: linear-gradient(135deg,darkmagenta,darkorchid,);
            display: grid;
            grid-template-columns: 1fr;   
             align-items: center;
        }
        footer{
            height: 50px;
            background-color: darkkhaki;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 26px;
        }
    </style>
</head>
<body>
    
    <div class="header">
 <h1>Header Elements</h1>
    </div>

    
    <div class="nav">
        <div>Home</div>
        <div>About</div>
        <div>Login</div>
    </div>
</div>

<div class="main">
    <div class="left">
        <div class="box">SmallBox1</div>
        <div class="box">SmallBox2</div>
        <div class="box">SmallBox3</div>

        <div class="content">Maincontent</div>

    </div>

    <div class="sidebar">Sidebar</div>
    
</div>

<footer>Footer</footer>

    
</body>
</html>
